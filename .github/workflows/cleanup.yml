name: 🧹 Cleanup Cancelled Runs & Failed Runs

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  delete-failed-or-cancelled:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: 📂 Get Code
        uses: actions/checkout@v4

      - name: 🗑️ Delete Cancelled and Failed Runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Loop back on runs 'cancelled' or 'failure' of all workflows
          for status in cancelled failure; do
            echo "Processing status: $status"
            # 1. Listing last 100 runs for the current status
            # 2. Get only their IDs
            # 3. Remove them one by one
            gh run list --status "$status" --limit 100 --json databaseId -q '.[].databaseId' | xargs -r -I{} gh run delete {}
          done

          # 2. Deletes all workflows which name are "maj", "maj doc", "fix" or "fix pipeline"
          gh run list --limit 100 --json databaseId,displayTitle --state completed \
          -q '.[] | select(.displayTitle | test("maj|maj doc|fix|fix"; "i")) | .databaseId' \
          | xargs -r -t -I{} gh run delete {}

          # 3. Deletes the history of this specific workflow (even successes)
          WORKFLOW_FILE="cleanup.yml"

          gh run list --workflow "$WORKFLOW_FILE" --status completed --json databaseId,number -q ".[] | select(.databaseId != $GITHUB_RUN_ID) | .databaseId" \
          | xargs -r -I{} gh run delete {}
